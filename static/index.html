<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doxify</title>
<style>body{font-family:system-ui,sans-serif;max-width:720px;margin:45px auto;padding:0 18px;background:#f5f7fb;color:#17243b}main{background:white;padding:28px;border-radius:14px;box-shadow:0 3px 18px #0001}label{display:block;margin-top:18px;font-weight:600}textarea,select,input{box-sizing:border-box;width:100%;margin-top:6px;padding:11px;border:1px solid #c9d1de;border-radius:7px}textarea{min-height:130px}button{margin-top:22px;padding:12px 24px;background:#2859bc;color:white;border:0;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap;margin-top:20px}a{display:inline-block;margin-top:12px}a[hidden]{display:none!important}</style></head>
<body><main><h1>Doxify</h1><p>Generate PDF, PowerPoint or Excel files using a prompt.</p><form id="form"><label>What would you like to create?<textarea name="prompt" required minlength="5" placeholder="Create a 10-slide presentation about quarterly performance"></textarea></label><label>Format<select name="fmt"><option value="auto">Auto detect</option><option value="pdf">PDF</option><option value="pptx">PowerPoint</option><option value="xlsx">Excel</option></select></label><label>Optional CSV file<input name="csv" type="file" accept=".csv,text/csv"></label><button id="submit">Generate</button></form><div id="result" role="status"></div><a id="download" hidden>Download file</a></main>
<script>
const form=document.getElementById('form'),result=document.getElementById('result'),download=document.getElementById('download'),btn=document.getElementById('submit');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
form.addEventListener('submit',async event=>{event.preventDefault();btn.disabled=true;download.hidden=true;result.textContent='Submitting...';const data=new FormData(form);if(!data.get('csv')?.size)data.delete('csv');try{const response=await fetch('/jobs',{method:'POST',body:data});const job=await response.json();if(!response.ok)throw Error(job.detail||'Could not submit job');for(let i=0;i<120;i++){const r=await fetch('/jobs/'+job.id);const status=await r.json();result.textContent='Status: '+status.status+(status.error?'\n'+status.error:'')+(status.issues?.length?'\nIssues: '+JSON.stringify(status.issues,null,2):'');if(['completed','completed_with_warnings','failed'].includes(status.status)){if(status.status!=='failed'){download.href='/jobs/'+job.id+'/download';download.hidden=false;download.textContent='Download '+(status.fmt||'file').toUpperCase();}return;}await sleep(1000);}result.textContent='Still processing. Please refresh the job status later.';}catch(err){result.textContent=err.message;}finally{btn.disabled=false;}});
</script></body></html>
